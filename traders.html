<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RAID LOG — Торговцы</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#060a06;color:#c8d8c0;font-family:"Courier New",Courier,monospace;font-size:13px;line-height:1.5;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);z-index:9990}
header{background:#080c08;border-bottom:1px solid #2e6b31;position:sticky;top:0;z-index:100}
.hdr{max-width:1400px;margin:0 auto;padding:0 14px;height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:7px;flex-shrink:0;text-decoration:none}
.logo-box{width:24px;height:24px;border:1px solid #2e6b31;display:flex;align-items:center;justify-content:center;font-family:Impact,Arial,sans-serif;font-size:11px;color:#4caf50;font-weight:900}
.logo-name{font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#76ff7a}
.logo-name sup{font-size:13px;color:#2e6b31;vertical-align:super;margin-left:2px;font-family:"Courier New",monospace}
nav{display:flex;gap:1px}
nav a{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#7a967a;padding:3px 7px;border:1px solid transparent;transition:all .15s;white-space:nowrap;text-decoration:none}
nav a:hover{color:#4caf50;border-color:#263626}
nav a.active{color:#76ff7a;border-color:#2e6b31;background:rgba(76,175,80,.06)}
.hdr-user{font-size:12px;color:#4a5e4a;display:flex;align-items:center;gap:7px;flex-shrink:0}
.wrap{max-width:1400px;margin:0 auto;padding:12px 14px}
.ptitle{font-family:Impact,"Arial Narrow",Arial,sans-serif;font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:#c8d8c0;line-height:1}
.ptitle .hi{color:#76ff7a}
.plabel{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#2e6b31;margin-bottom:3px}
.phdr{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid #1e2e1e}
.btn{font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:6px 11px;border:1px solid;cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:transparent;transition:all .15s;white-space:nowrap;font-family:"Courier New",monospace;text-decoration:none}
.btn-g{color:#4caf50;border-color:#2e6b31}.btn-g:hover{background:rgba(76,175,80,.12);border-color:#4caf50;color:#76ff7a}
.btn-r{color:#d94040;border-color:rgba(217,64,64,.4)}.btn-r:hover{background:rgba(217,64,64,.1);border-color:#d94040}
.btn-gh{color:#7a967a;border-color:#263626}.btn-gh:hover{color:#c8d8c0;border-color:#7a967a}
.btn-a{color:#e6a817;border-color:rgba(230,168,23,.4)}.btn-a:hover{background:rgba(230,168,23,.1);border-color:#e6a817}
.btn-big{font-size:11px;padding:10px 18px;width:100%;justify-content:center;margin-top:5px}
.panel{background:#0f160f;border:1px solid #1e2e1e;padding:11px;margin-bottom:10px}
.ptit{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#2e6b31;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid #1e2e1e}
.srow2{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid #1a1a14}
.srow2:last-child{border-bottom:none}
.sl{color:#4a5e4a;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.sv{color:#c8d8c0}
.stash-list{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto}
.si{display:flex;align-items:center;gap:5px;padding:3px 5px;background:#111811;border:1px solid #1e2e1e}
.si-ico{font-size:12px;flex-shrink:0;width:16px;text-align:center}
.si-name{flex:1;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#7a967a}
.si-qty{font-size:13px;color:#4a5e4a}
.si-type{font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:1px 3px;border:1px solid;flex-shrink:0}
.t-weapon{color:#d94040;border-color:rgba(217,64,64,.3)}.t-armor{color:#4a8fbd;border-color:rgba(74,143,189,.3)}.t-medical{color:#4caf50;border-color:rgba(76,175,80,.3)}.t-item{color:#e6a817;border-color:rgba(230,168,23,.3)}
.si-sell{font-size:13px;padding:1px 4px;border:1px solid rgba(230,168,23,.3);cursor:pointer;color:#e6a817;background:transparent;font-family:"Courier New",monospace}
.si-sell:hover{background:rgba(230,168,23,.1)}
.equip-slot{background:#111811;border:1px solid #1e2e1e;padding:7px;margin-bottom:5px;display:flex;align-items:center;gap:7px}
.slot-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#4a5e4a;width:48px;flex-shrink:0}
.slot-sel{flex:1;background:#0f160f;border:1px solid #263626;color:#c8d8c0;font-family:"Courier New",monospace;font-size:13px;padding:4px 6px;outline:none}
.meq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:7px}
.meq-slot{background:#111811;border:1px solid #1e2e1e;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;text-transform:uppercase;color:#7a967a;min-height:46px;justify-content:center;transition:all .15s;text-align:center}
.meq-slot:hover{border-color:#2e6b31;color:#c8d8c0}
.meq-slot.sel{border-color:#4caf50;background:rgba(76,175,80,.08)}
.map-card{background:#111811;border:1px solid #1e2e1e;padding:8px 10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.map-card:hover{border-color:#2e6b31}
.map-card.sel{border-color:#4caf50;background:rgba(76,175,80,.05)}
.map-name{font-family:Impact,Arial,sans-serif;font-size:11px;font-weight:900;text-transform:uppercase;color:#c8d8c0}
.map-meta{font-size:11px;color:#4a5e4a;margin-top:1px}
.diff{display:flex;gap:2px}
.diff-d{width:5px;height:5px;border-radius:50%;background:#1e2e1e}
.diff-d.on{background:#d94040}
.upg-card{background:#111811;border:1px solid #1e2e1e;padding:9px;margin-bottom:6px}
.upg-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.upg-name{font-size:13px;color:#c8d8c0;display:flex;align-items:center;gap:4px}
.upg-lvl{font-size:13px;color:#4a5e4a;background:#1e2e1e;padding:1px 4px}
.upg-desc{font-size:11px;color:#7a967a;margin-bottom:4px}
.upg-next{font-size:11px;color:#4a5e4a;line-height:1.5}
.hp-wrap{background:#111811;border:1px solid #1e2e1e;padding:9px;margin-bottom:8px}
.hp-track{height:10px;background:#1e2e1e;border:1px solid #263626;margin:5px 0}
.hp-fill{height:100%;transition:width .4s,background .4s}
.hud-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:7px}
.hud-card{background:#0f160f;border:1px solid #1e2e1e;padding:6px 9px}
.hud-lbl{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#4a5e4a;margin-bottom:1px}
.hud-val{font-family:Impact,Arial,sans-serif;font-size:16px;font-weight:900;line-height:1}
.hud-track{height:3px;background:#1e2e1e;margin-top:2px}
.hud-fill{height:100%;transition:width .3s,background .3s}
.game-layout{display:grid;grid-template-columns:1fr 195px;gap:10px;align-items:start}
#gc{display:block;image-rendering:pixelated;cursor:default}
.canvas-wrap{background:#060806;border:1px solid #1e2e1e;overflow:auto;line-height:0}
#search-bar{background:#080e08;border:1px solid #2e6b31;padding:7px 10px;margin-bottom:7px;display:none}
#loot-pick{background:#080e08;border:1px solid #2e6b31;padding:11px;margin-bottom:7px;display:none}
.ms-btn{display:flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid #263626;cursor:pointer;color:#7a967a;background:#111811;font-family:"Courier New",monospace;font-size:12px;text-align:left;transition:all .15s;width:100%;margin-bottom:4px}
.ms-btn:hover{border-color:#4caf50;color:#c8d8c0}
.ms-btn.need{border-color:#d94040!important;color:#ff9090!important;animation:np .7s infinite}
@keyframes np{0%,100%{opacity:1}50%{opacity:.4}}
.ms-key{background:#1a2a1a;border:1px solid #263626;padding:0 4px;font-size:11px;color:#4caf50;flex-shrink:0;min-width:14px;text-align:center}
.status-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px;min-height:16px;font-size:12px}
.alog{height:115px;overflow-y:auto;font-size:12px}
.log-line{padding:2px 0;border-bottom:1px solid #121812;color:#7a967a}
.log-line:last-child{border-bottom:none}
.log-good{color:#4caf50}.log-loot{color:#e6a817}.log-danger{color:#c0392b}.log-hit{color:#e74c3c}.log-warn{color:#e6a817}.log-status{color:#4a8fbd}
.touch-pad{display:none;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px;justify-content:center;margin:6px 0}
.tp-btn{background:#111811;border:1px solid #263626;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:#7a967a;font-family:"Courier New",monospace}
.tp-btn:active{background:#1a2a1a}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
.overlay.show{display:flex}
.ov-ico{font-size:44px;margin-bottom:10px}
.ov-title{font-family:Impact,Arial,sans-serif;font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.overlay.win .ov-title{color:#76ff7a}.overlay.dead .ov-title{color:#d94040}
.ov-sub{font-size:13px;color:#7a967a;margin-bottom:14px}
.ov-box{background:#0f160f;border:1px solid #1e2e1e;padding:11px 18px;margin-bottom:14px;min-width:240px;max-width:360px;text-align:left}
.srow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid #1a1a14}
.srow:last-child{border-bottom:none}
.srow-l{color:#4a5e4a;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.srow-v{color:#76ff7a}
.ov-btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
/* AUTH */
.auth-box{background:#0f160f;border:1px solid #1e2e1e;padding:22px;max-width:400px;margin:50px auto}
.auth-tabs{display:flex;margin-bottom:16px;border-bottom:1px solid #1e2e1e}
.auth-tab{font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:6px 12px;cursor:pointer;color:#4a5e4a;border:none;background:transparent;font-family:"Courier New",monospace;border-bottom:2px solid transparent;transition:all .15s}
.auth-tab.active{color:#76ff7a;border-bottom-color:#4caf50}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#7a967a;margin-bottom:4px}
.fg input{width:100%;background:#111811;border:1px solid #263626;color:#c8d8c0;font-family:"Courier New",monospace;font-size:12px;padding:8px 10px;outline:none;transition:border-color .15s}
.fg input:focus{border-color:#2e6b31}
.ferr{font-size:12px;color:#d94040;margin-top:3px}
/* TRADERS PAGE */
.traders-wrap{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 47px)}
.tr-sidebar{background:#080c08;border-right:1px solid #1e2e1e}
.tr-item{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.tr-item:hover{background:#0f160f}
.tr-item.active{border-left-color:#4caf50;background:#0f160f}
.tr-icon{font-size:22px;flex-shrink:0}
.tr-name{font-family:Impact,Arial,sans-serif;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.tr-desc{font-size:11px;color:#4a5e4a;margin-top:1px;letter-spacing:.03em}
.tr-main{padding:16px;overflow-y:auto}
.tr-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1e2e1e}
.tr-hdr-ico{font-size:38px}
.tr-hdr-name{font-family:Impact,Arial,sans-serif;font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}
.tr-hdr-desc{font-size:12px;color:#7a967a;margin-top:3px}
.tr-hdr-rate{font-size:11px;color:#e6a817;margin-top:3px}
.tr-money{background:#111811;border:1px solid #1e2e1e;padding:7px 12px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.tr-sections{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tr-sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#2e6b31;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid #1e2e1e;display:flex;justify-content:space-between;align-items:center}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin-bottom:10px}
.shop-card{background:#111811;border:1px solid #1e2e1e;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .2s;cursor:pointer;text-align:center;position:relative}
.shop-card:hover{border-color:#2e6b31;background:#141f14;transform:translateY(-1px)}
.shop-card:active{transform:translateY(0)}
.sc-ico{font-size:24px;margin-bottom:1px}
.sc-name{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#c8d8c0;line-height:1.2}
.sc-desc{font-size:13px;color:#4a5e4a;letter-spacing:.02em}
.sc-price{font-size:11px;color:#e6a817;font-family:Impact,Arial,sans-serif;font-weight:900;margin-top:2px}
.sc-badge{position:absolute;top:3px;right:3px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:1px 3px;border:1px solid}
.sc-out{opacity:.35;cursor:not-allowed}
.sc-out:hover{transform:none!important;border-color:#1e2e1e!important;background:#111811!important}
.sell-list{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto}
.sell-row{display:flex;align-items:center;gap:7px;padding:5px 7px;background:#0f160f;border:1px solid #1e2e1e}
.sell-row:hover{border-color:#263626}
.sr-ico{font-size:13px;flex-shrink:0;width:18px;text-align:center}
.sr-name{flex:1;font-size:12px;color:#c8d8c0;text-transform:uppercase;letter-spacing:.03em}
.sr-qty{font-size:11px;color:#4a5e4a;flex-shrink:0}
.sr-price{font-size:12px;color:#e6a817;flex-shrink:0;margin-right:4px}
.sr-btn{font-size:13px;padding:2px 6px;border:1px solid rgba(230,168,23,.4);cursor:pointer;color:#e6a817;background:transparent;font-family:"Courier New",monospace}
.sr-btn:hover{background:rgba(230,168,23,.1)}
/* RUNS */
.run-card{background:#0f160f;border:1px solid #1e2e1e;padding:8px 10px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
.run-card.survived{border-left:2px solid #4caf50}
.run-card.dead-c{border-left:2px solid #d94040}
/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 240px;gap:14px}
.ap{background:#0f160f;border:1px solid #1e2e1e;padding:11px;margin-bottom:8px}
.ap-t{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#2e6b31;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1e2e1e}
.atext{font-size:11px;color:#7a967a;line-height:1.75}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.blink::before{content:"● ";color:#4caf50;animation:blink 1.5s infinite}
@media(max-width:900px){.game-layout{grid-template-columns:1fr}.traders-wrap{grid-template-columns:1fr}.tr-sections{grid-template-columns:1fr}.about-grid{grid-template-columns:1fr}.touch-pad{display:grid}.hud-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.hud-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

var DB_KEY   = 'rl_db';
var AUTH_KEY = 'rl_auth';

function getDB(){try{return JSON.parse(localStorage.getItem(DB_KEY))||{users:{}};}catch{return{users:{}};}}
function saveDB(db){localStorage.setItem(DB_KEY,JSON.stringify(db));}
function getCurLogin(){return localStorage.getItem(AUTH_KEY);}
function getCurUser(){var l=getCurLogin();if(!l)return null;return getDB().users[l]||null;}
function saveCurUser(u){var db=getDB();db.users[u.login]=u;saveDB(db);}

function register(login,pass){
  if(!login||!pass)         return{ok:false,err:'Заполни оба поля'};
  if(login.length<3)        return{ok:false,err:'Логин мин. 3 символа'};
  if(pass.length<4)         return{ok:false,err:'Пароль мин. 4 символа'};
  if(!/^[a-zA-Z0-9_]+$/.test(login)) return{ok:false,err:'Только a-z 0-9 _'};
  var db=getDB();
  if(db.users[login])       return{ok:false,err:'Логин занят'};
  db.users[login]={
    login, pw:hashPw(pass),
    hp:100, maxHp:100, money:500,
    shelter:{upgrades:{stash:0,medstation:0,heating:0,security:0}},
    stash:JSON.parse(JSON.stringify(STARTER)),
    equipped:{weapon:'fists',armor:'none',ammo:0,meds:[null,null,null]},
    stats:{runs:0,survived:0,kills:0},
    runs:[],
  };
  saveDB(db);
  return{ok:true};
}

function login(login,pass){
  var db=getDB(),u=db.users[login];
  if(!u)               return{ok:false,err:'Пользователь не найден'};
  if(u.pw!==hashPw(pass)) return{ok:false,err:'Неверный пароль'};
  localStorage.setItem(AUTH_KEY,login);
  return{ok:true};
}
function logout(){localStorage.removeItem(AUTH_KEY);}

function stashCap(u){return UPGRADES.stash.levels[u.shelter.upgrades.stash||0].cap;}
function addToStash(u,item){if(u.stash.length>=stashCap(u))return false;u.stash.push(Object.assign({uid:uid()},item));return true;}
function countInStash(u,id){return u.stash.reduce(function(a,s){return s.id===id?a+(s.qty||1):a;},0);}

function doHeal(u,amount){
  var lvl=u.shelter.upgrades.medstation||0;
  var def=UPGRADES.medstation.levels[lvl];
  if(!def.healPerHp)return{ok:false,err:'Нет медпункта'};
  var miss=u.maxHp-u.hp, heal=Math.min(amount,miss);
  if(heal<=0)return{ok:false,err:'HP уже полное'};
  var cost=heal*def.healPerHp;
  if(u.money<cost)return{ok:false,err:'Нужно '+fm(cost)};
  u.money-=cost; u.hp+=heal;
  saveCurUser(u);
  return{ok:true,heal,cost};
}

function doUpgrade(u,key){
  var upg=UPGRADES[key];
  var cur=u.shelter.upgrades[key]||0;
  if(cur>=upg.levels.length-1)return{ok:false,err:'Макс уровень'};
  var next=upg.levels[cur+1];
  if(u.money<next.cost)return{ok:false,err:'Нужно '+fm(next.cost)};
  for(var i=0;i<next.mats.length;i++){
    var m=next.mats[i];
    if(countInStash(u,m.id)<m.n)return{ok:false,err:'Нужно '+( ITEMS[m.id]?ITEMS[m.id].name:m.id)+' ×'+m.n};
  }
  u.money-=next.cost;
  next.mats.forEach(function(m){
    var rem=m.n;
    for(var i=u.stash.length-1;i>=0&&rem>0;i--){
      var s=u.stash[i];
      if(s.id===m.id){var t=Math.min(s.qty||1,rem);rem-=t;s.qty=(s.qty||1)-t;if(s.qty<=0)u.stash.splice(i,1);}
    }
  });
  u.shelter.upgrades[key]++;
  // Обновить maxHp
  u.maxHp=100+(UPGRADES.heating.levels[u.shelter.upgrades.heating||0].hpBonus);
  saveCurUser(u);
  return{ok:true};
}

function doSell(u,stashUid,rate){
  var idx=u.stash.findIndex(function(s){return s.uid===stashUid;});
  if(idx===-1)return{ok:false,err:'Не найдено'};
  var item=u.stash[idx];
  var val=(item.data?item.data.value:0)||0;
  var earned=Math.floor(val*(rate||0.4)*(item.qty||1));
  u.money+=earned;
  u.stash.splice(idx,1);
  saveCurUser(u);
  return{ok:true,earned};
}

function doBuy(u,trader,offerIdx){
  var offer=trader.sells[offerIdx];
  if(!offer)return{ok:false,err:'Нет товара'};
  if(u.money<offer.price)return{ok:false,err:'Нужно '+fm(offer.price)};
  if(u.stash.length>=stashCap(u))return{ok:false,err:'Схрон переполнен'};
  u.money-=offer.price;
  var data=offer.ref==='weapon'?WEAPONS[offer.id]:offer.ref==='armor'?ARMORS[offer.id]:offer.ref==='medical'?MEDICALS[offer.id]:ITEMS[offer.id];
  addToStash(u,{type:offer.ref,id:offer.id,qty:offer.qty||1,data:data});
  saveCurUser(u);
  return{ok:true};
}

function saveRun(run){
  var u=getCurUser();if(!u)return;
  u.runs.unshift(run);
  if(u.runs.length>30)u.runs=u.runs.slice(0,30);
  u.stats.runs++;
  if(run.survived){
    u.stats.survived++;
    var secLvl=u.shelter.upgrades.security||0;
    run.loot.forEach(function(item){addToStash(u,item);});
  }
  u.stats.kills+=(run.kills||0);
  u.hp=Math.max(1,run.hpLeft);
  saveCurUser(u);
}

// ══════════ УТИЛИТЫ ══════════
function hashPw(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return'h'+Math.abs(h).toString(16);}
function uid(){return'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pad(n){return n<10?'0'+n:''+n;}
function fm(n){return(n||0).toLocaleString('ru')+RUB;}
function fd(iso){var d=new Date(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function pickLoot(ctypeKey, bias){
  var pool=LOOT_POOLS[ctypeKey]?LOOT_POOLS[ctypeKey].pool:LOOT_POOLS.chest.pool;
  var key;
  if(bias&&bias.length&&Math.random()<0.5){key=bias[Math.floor(Math.random()*bias.length)];}
  else{key=pool[Math.floor(Math.random()*pool.length)];}
  if(WEAPONS[key])  return{type:'weapon', id:key,data:WEAPONS[key], qty:1};
  if(ARMORS[key])   return{type:'armor',  id:key,data:ARMORS[key],  qty:1};
  if(MEDICALS[key]) return{type:'medical',id:key,data:MEDICALS[key],qty:rnd(1,3)};
  if(ITEMS[key])    return{type:'item',   id:key,data:ITEMS[key],   qty:rnd(1,ITEMS[key].stackQty||1)};
  return null;
}

function toast(msg,bad){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:18px;right:18px;background:#080e08;border:1px solid '+(bad?'#d94040':'#2e6b31')+';color:'+(bad?'#ff7070':'#76ff7a')+';font-family:"Courier New",monospace;font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding:9px 15px;z-index:9999';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2500);
}

(function(){
  var l=localStorage.getItem('rl_auth');
  if(!l){window.location.href='login.html';return;}
  var el=document.getElementById('hdr-user');
  if(!el) return;
  var u=(typeof getCurUser==='function')?getCurUser():null;
  if(u) el.innerHTML = '<span>'+l+'</span> <span style="color:#4caf50">HP:'+u.hp+'</span> <span style="color:#e6a817">'+(typeof fm==='function'?fm(u.money):u.money)+'</span> <a href="logout.html" class="btn btn-gh" style="padding:2px 6px;font-size:11px">Выйти</a>';
})();
</script>
<div class="traders-wrap">
  <div class="tr-sidebar" id="tr-sidebar"></div>
  <div class="tr-main" id="tr-main"><div style="color:#4a5e4a;font-size:11px;padding:30px">Выбери торговца слева</div></div>
</div>
<script>
var activeTr=null;

function init(){
  var u=getCurUser();if(!u)return;
  renderSidebar(u);
  selectTr(TRADERS[0].id);
}

function renderSidebar(u){
  document.getElementById('tr-sidebar').innerHTML=TRADERS.map(function(t){
    return'<div class="tr-item'+(activeTr===t.id?' active':'')+'" onclick="selectTr(\''+t.id+'\')">'
      +'<div class="tr-icon">'+t.icon+'</div>'
      +'<div><div class="tr-name" style="color:'+t.color+'">'+t.name+'</div><div class="tr-desc">'+t.desc.slice(0,35)+'</div></div>'
      +'</div>';
  }).join('');
}

function selectTr(id){
  activeTr=id;
  var u=getCurUser();if(!u)return;
  renderSidebar(u);renderTrMain(u,id);
}

function renderTrMain(u,id){
  var tr=TRADERS.find(function(t){return t.id===id;});
  var el=document.getElementById('tr-main');if(!tr||!el)return;

  var h='<div class="tr-hdr">'
    +'<div class="tr-hdr-ico">'+tr.icon+'</div>'
    +'<div><div class="tr-hdr-name" style="color:'+tr.color+'">'+tr.name+'</div>'
    +'<div class="tr-hdr-desc">'+tr.desc+'</div>'
    +'<div class="tr-hdr-rate">Скупает по '+Math.round(tr.buyRate*100)+'% от цены</div>'
    +'</div></div>';

  h+='<div class="tr-money">'
    +'<span style="font-size:11px;color:#4a5e4a;text-transform:uppercase;letter-spacing:.07em">Деньги:</span>'
    +'<span style="font-family:Impact,Arial,sans-serif;font-size:18px;color:#e6a817">'+fm(u.money)+'</span>'
    +'<span style="font-size:11px;color:#4a5e4a;margin-left:auto">HP: <span style="color:#4caf50">'+u.hp+'/'+u.maxHp+'</span></span>'
    +'</div>';

  h+='<div class="tr-sections"><div>';
  h+='<div class="tr-sec-title"><span>// Купить</span><span style="color:#4a5e4a;font-size:11px">нажми → купить</span></div>';
  h+='<div class="shop-grid">';

  tr.sells.forEach(function(offer,idx){
    var d=offer.ref==='weapon'?WEAPONS[offer.id]:offer.ref==='armor'?ARMORS[offer.id]:offer.ref==='medical'?MEDICALS[offer.id]:ITEMS[offer.id];
    if(!d)return;
    var icon=d.icon||'❓';
    var canAfford=u.money>=offer.price;
    var full=u.stash.length>=stashCap(u);
    var dis=!canAfford||full;
    var bcls='sc-badge '+(offer.ref==='weapon'?'t-weapon':offer.ref==='armor'?'t-armor':offer.ref==='medical'?'t-medical':'t-item');
    h+='<div class="shop-card'+(dis?' sc-out':'')+'" onclick="buyBtn(\''+id+'\','+idx+')">'
      +'<span class="'+bcls+'">'+offer.ref+'</span>'
      +'<div class="sc-ico">'+icon+'</div>'
      +'<div class="sc-name">'+esc(d.name||'?')+(offer.qty>1?' ×'+offer.qty:'')+'</div>'
      +'<div class="sc-desc">'+(d.desc||d.cat||'')+'</div>'
      +'<div class="sc-price" style="color:'+(canAfford?'#e6a817':'#d94040')+'">'+fm(offer.price)+'</div>'
      +'</div>';
  });
  h+='</div></div><div>';

  var sellable=u.stash.filter(function(s){
    if(!s.data)return false;
    return tr.buys.some(function(cat){
      if(cat==='weapon') return s.type==='weapon';
      if(cat==='armor')  return s.type==='armor';
      if(cat==='medical')return s.type==='medical';
      return s.type==='item'&&s.data.cat===cat;
    });
  });

  h+='<div class="tr-sec-title"><span>// Продать</span>'
    +(sellable.length?'<button class="btn btn-gh" style="padding:1px 6px;font-size:13px" onclick="sellAllBtn(\''+id+'\')">Всё</button>':'')
    +'</div>';
  if(!sellable.length){h+='<div style="color:#4a5e4a;font-size:12px;padding:10px 0">Нечего продать</div>';}
  else{
    h+='<div class="sell-list">'+sellable.map(function(s){
      var d=s.data||{},val=Math.floor((d.value||0)*tr.buyRate*(s.qty||1));
      return'<div class="sell-row"><span class="sr-ico">'+(d.icon||'?')+'</span>'
        +'<span class="sr-name">'+esc(d.name||'?')+'</span>'
        +(s.qty>1?'<span class="sr-qty">×'+s.qty+'</span>':'')
        +'<span class="sr-price">'+fm(val)+'</span>'
        +'<button class="sr-btn" onclick="sellBtn(\''+s.uid+'\','+tr.buyRate+')">Продать</button>'
        +'</div>';
    }).join('')+'</div>';
  }
  h+='</div></div>';
  el.innerHTML=h;
}

function buyBtn(tid,idx){
  var tr=TRADERS.find(function(t){return t.id===tid;});
  var u=getCurUser();if(!tr||!u)return;
  var r=doBuy(u,tr,idx);
  if(!r.ok){toast(r.err,true);return;}
  toast('Куплено!');renderTrMain(getCurUser(),tid);
}

function sellBtn(uid,rate){
  var u=getCurUser();if(!u)return;
  var r=doSell(u,uid,rate);if(!r.ok){toast(r.err,true);return;}
  toast('+'+fm(r.earned));renderTrMain(getCurUser(),activeTr);
}

function sellAllBtn(tid){
  var tr=TRADERS.find(function(t){return t.id===tid;});
  var u=getCurUser();if(!tr||!u)return;
  var sellable=u.stash.filter(function(s){
    if(!s.data)return false;
    return tr.buys.some(function(cat){
      if(cat==='weapon') return s.type==='weapon';
      if(cat==='armor')  return s.type==='armor';
      if(cat==='medical')return s.type==='medical';
      return s.type==='item'&&s.data.cat===cat;
    });
  });
  var total=0;
  sellable.forEach(function(s){var r=doSell(getCurUser(),s.uid,tr.buyRate);if(r.ok)total+=r.earned;u=getCurUser();});
  toast('Продано на '+fm(total));renderTrMain(getCurUser(),tid);
}

window.addEventListener('DOMContentLoaded',init);
</script>
